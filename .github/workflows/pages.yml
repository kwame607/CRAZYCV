# Static PREVIEW of the site on GitHub Pages (https://<user>.github.io/CRAZYCV/).
# Pages cannot run server code, so the /api routes are removed for this build only;
# the UI shows those values as "Unavailable". Deploy for real on a Next.js host.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Quality gates run against the normal (server) configuration, before API routes are removed.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Remove server-only API routes (static export cannot include them)
        run: rm -rf src/app/api
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_PREVIEW: "true"
          NEXT_PUBLIC_BASE_PATH: /CRAZYCV
          NEXT_PUBLIC_SITE_URL: https://kwame607.github.io/CRAZYCV
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          NEXT_PUBLIC_APP_VERSION: 0.1.0
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
